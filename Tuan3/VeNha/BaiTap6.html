<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Học web chuẩn</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    .portfolio {
      max-width: 960px;
      margin: 0 auto;
    }
    .portfolio h2 {
      margin: 0;
      padding-top: 30px;
      text-align: center;
      font-size: 26px;
      color: #222;
      background-color: #f8f8f8;   /* tiêu đề và hàng tab cùng một nền xám nhạt */
    }
    /* gạch ngang ngắn dưới tiêu đề */
    .portfolio h2::after {
      content: "";
      display: block;
      width: 60px;
      height: 2px;
      margin: 15px auto 0;
      background-color: #2a9d9d;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .list-tab {
      padding: 25px 0 30px;
      text-align: center;
      background-color: #f8f8f8;
    }
    .list-tab li {
      display: inline-block;
      margin: 0 10px;
    }
    .list-tab a {
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }
    .list-tab li:first-child a {
      color: #2a9d9d;   /* mục All đang chọn */
    }
    .galerry {
      margin-top: 8px;
      overflow: hidden;   /* để khung ul ôm lấy các li đang float */
    }
    .galerry li {
      float: left;
      width: 31.5%;
      margin: 0 2.75% 20px 0;
    }
    .galerry li:nth-child(3n) {
      margin-right: 0;   /* ảnh cuối mỗi hàng không cần cách phải */
    }
    .galerry img {
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <section class="portfolio">
    <h2>MY PORTFOLIO</h2>
    <ul class="list-tab">
      <li><a href="./">All</a></li>
      <li><a href="./">Web App</a></li>
      <li><a href="./">UI/UX</a></li>
      <li><a href="./">Graphics Design</a></li>
      <li><a href="./">Mobile App</a></li>
      <li><a href="./">Branding</a></li>
      <li><a href="./">Marketing</a></li>
    </ul>
    <ul class="galerry">
      <li><a href="./"><img src="images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="images/img_350x260.png" alt=""></a></li>
      <li><a href="./"><img src="images/img_350x260.png" alt=""></a></li>
    </ul>
  </section>
</body>
</html>
