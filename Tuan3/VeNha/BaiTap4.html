<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài tập 4 - Menu ngang</title>
  <style>
    ul {
      list-style: none;   /* bỏ dấu chấm đầu dòng */
      margin: 0;
      padding: 0;
    }
    li {
      display: inline-block;   /* xếp ngang nhưng vẫn đặt được chiều rộng */
      width: 150px;
      padding: 8px 0;
      text-align: center;
      font-size: 20px;
      background-color: aqua;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="#">TMDT</a></li>
    <li><a href="#">ERP</a></li>
    <li><a href="#">MIS</a></li>
    <li><a href="#">DS</a></li>
  </ul>
</body>
</html>
