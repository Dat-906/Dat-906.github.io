<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài tập 9 - Font Awesome</title>
  <!-- Nhúng Font Awesome 5 từ CDN -->
  <link rel="stylesheet" href="fontawesome/css/all.min.css">
  <style>
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: inline-block;
      width: 150px;
      padding: 8px 0;
      text-align: center;
      font-size: 20px;
      background-color: aqua;
    }
    li i { margin-right: 6px; }
  </style>
</head>
<body>
  <ul>
    <li><a href="#"><i class="fas fa-shopping-cart"></i>TMDT</a></li>
    <li><a href="#"><i class="fas fa-building"></i>ERP</a></li>
    <li><a href="#"><i class="fas fa-chart-line"></i>MIS</a></li>
    <li><a href="#"><i class="fas fa-database"></i>DS</a></li>
  </ul>
</body>
</html>
