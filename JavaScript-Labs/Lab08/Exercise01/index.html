<header>
  <h1>Exercise 8.1 &ndash; Enabling/Disabling JavaScript</h1>
</header>

<!-- Mặc định ghi "disabled". Nếu JavaScript chạy được thì đoạn script bên dưới sẽ đổi thành "enabled". -->
<h2 id="jsStatus" style="color:#b00020">You have JavaScript disabled</h2>

<script type="text/javascript">
  document.getElementById("jsStatus").innerHTML = "You have JavaScript enabled";
  document.getElementById("jsStatus").style.color = "#1b7f3b";
</script>

<noscript>
  <p>Trình duyệt đang tắt JavaScript, nên dòng chữ ở trên không được đổi.</p>
</noscript>
